[project]
name = "tautrack"
version = "0.1.0"
description = "Monitoring, logging and trend analysis for GPS-disciplined oscillators"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Derek Rowland" }]
keywords = ["gpsdo", "gps", "oscillator", "frequency-standard", "scpi", "z3801a"]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "pyserial>=3.5",
  # The IANA timezone database. Neither Windows nor python:*-slim ships one, so
  # zoneinfo cannot resolve any key - including "UTC" - without this.
  "tzdata>=2024.1",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-http>=1.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
tautrack = "tautrack.__main__:main"

[project.urls]
Homepage = "https://github.com/gx1400/tautracker"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tautrack = ["store/*.sql", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = [
  "E501",   # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["A003"]
