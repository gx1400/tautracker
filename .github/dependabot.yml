version: 2
updates:
  # Python dependencies declared in pyproject.toml.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      # Conventional Commits, so release-please classifies these correctly.
      prefix: "build"
      prefix-development: "chore"
      include: scope
    groups:
      otel:
        patterns: ["opentelemetry*"]
      web:
        patterns: ["fastapi", "uvicorn*", "jinja2", "pydantic*"]
      dev:
        dependency-type: development

  # GitHub Actions are pinned by commit SHA, which means they cannot be updated by
  # hand realistically - Dependabot is what keeps the pins current, and it rewrites
  # both the SHA and the trailing version comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: scope

  # Base image updates for the container.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
      include: scope
