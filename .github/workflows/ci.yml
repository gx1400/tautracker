name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs opt in to what they need. The repository is public
# and may take pull requests from forks, so no job gets write access.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Coverage floor. Raise this as suites land - never lower it to make a build pass.
  COVERAGE_MIN: "70"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install "ruff==0.14.6"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format check
        run: ruff format --check --diff .

  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor because config parsing relies on stdlib tomllib.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pytest-cov

      - name: Tests with coverage gate
        run: |
          pytest -q \
            --cov=tautrack \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under="${COVERAGE_MIN}"

      - name: Upload coverage
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  docker:
    name: Container builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only. Publishing happens from a release, never from a pull request,
      # so a fork cannot push an image.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: tautrack:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        # The container must at least start, read its config and report its version
        # without a device attached.
        run: docker run --rm tautrack:ci --version
